<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue &amp; Rate Limit Tests - YouTube Auto Reply</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 { color: #333; }
    .summary { background: #e3f2fd; padding: 16px; border-radius: 4px; margin-top: 20px; font-size: 14px; }
    .summary.passed { background: #e8f5e9; }
    .summary.failed { background: #ffebee; }
  </style>
</head>
<body>
  <h1>Queue &amp; Rate Limit Tests</h1>
  <p>YouTube Auto Reply Extension &mdash; the safety envelope between "a reply was generated" and "a reply was posted"</p>

  <div id="test-output"></div>

  <script type="module">
    import runAllTests from './queue-rate-limit-tests.js';

    const output = document.getElementById('test-output');
    const results = await runAllTests();

    const summary = document.createElement('div');
    summary.className = 'summary ' + (results.failed === 0 ? 'passed' : 'failed');
    summary.innerHTML = `
      <strong>Test Summary</strong><br>
      Total: ${results.total}<br>
      Passed: ${results.passed}<br>
      Failed: ${results.failed}
    `;

    output.appendChild(summary);
  </script>
</body>
</html>
