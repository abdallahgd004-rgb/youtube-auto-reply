<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Mode Routing Tests - YouTube Auto Reply</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 { color: #333; }
    .summary {
      background: #e3f2fd;
      padding: 16px;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 14px;
    }
    .summary.passed { background: #e8f5e9; }
    .summary.failed { background: #ffebee; }
  </style>
</head>
<body>
  <h1>Hybrid Mode Routing Tests</h1>
  <p>YouTube Auto Reply Extension — Phase 20.15 (trigger first, knowledge fallback)</p>

  <div id="test-output"></div>

  <script type="module">
    // No chrome stub and no network: `complete` is injected, which is the whole reason
    // both paths are injected, so no model is involved.
    import runAllTests from './reply-router-tests.js';

    const results = await runAllTests();

    const summary = document.createElement('div');
    summary.className = 'summary ' + (results.failed === 0 ? 'passed' : 'failed');
    summary.innerHTML = `
      <strong>Test Summary</strong><br>
      Total: ${results.total}<br>
      Passed: ${results.passed}<br>
      Failed: ${results.failed}
    `;

    document.getElementById('test-output').appendChild(summary);

    // Machine-readable result for any headless runner, which cannot read the console.
    window.__TEST_RESULTS__ = results;
  </script>
</body>
</html>
