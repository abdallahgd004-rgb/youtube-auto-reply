<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Heart Tests - YouTube Auto Reply</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 { color: #333; }
    .summary {
      background: #e3f2fd;
      padding: 16px;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 14px;
    }
    .summary.passed { background: #e8f5e9; }
    .summary.failed { background: #ffebee; }
  </style>
</head>
<body>
  <h1>Creator Heart Tests</h1>
  <p>YouTube Auto Reply Extension — <code>isHeartedComment()</code> scopes the channel owner's heart to
     the comment's own view model, so a heart on a reply or a sibling comment never excludes the parent.</p>

  <div id="test-output"></div>

  <!-- The adapter is NOT loaded as a page script. Doing so would define a global
       YouTubeSiteAdapter closing over this page's real document with no diagnostics shim,
       so creator-heart-tests.js would silently test the wrong copy. loadAdapter()
       evaluates the source in a sandbox instead. -->
  <script type="module">
    import runAllTests from './creator-heart-tests.js';

    const output = document.getElementById('test-output');
    const results = await runAllTests();
    // Named failures, so a red run says WHICH case failed rather than only how many. The
    // runner prints the counts; this is for the human reading the page or the console.
    window.__TEST_RESULTS__ = results;

    const summary = document.createElement('div');
    summary.className = 'summary ' + (results.failed === 0 ? 'passed' : 'failed');
    // Named failures are rendered, not just counted: a red run that says "1 of 15 failed"
    // without saying WHICH is a red run you have to go re-derive by hand.
    const failureList = results.failures.length
      ? '<ul>' + results.failures.map((f) => `<li>${f}</li>`).join('') + '</ul>'
      : '';
    summary.innerHTML = `
      <strong>Test Summary</strong><br>
      Total: ${results.total}<br>
      Passed: ${results.passed}<br>
      Failed: ${results.failed}
      ${failureList}
    `;

    output.appendChild(summary);
  </script>
</body>
</html>
